name: 新着を取り直す

on:
  schedule:
    # 毎日 6:10 と 15:10(日本時間)
    - cron: "10 21 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 公式サイトの新着を取りこむ
        run: python tools/update_live.py live.js
      - name: 変わっていたら保存する
        run: |
          if git diff --quiet -- live.js; then
            echo "変わりなし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live.js
            git commit -m "新着を取り直した"
            git push
          fi
